<style>
/* Layout: one road-trip column (max 760px). A green freeway distance sign opens the page,
   a Monday-first calendar mirrors the group's sheet, and every day hangs off a mile-marker post. */
:root {
  --bg: #EDF1EE;
  --surface: #FFFFFF;
  --surface-2: #F4F7F5;
  --ink: #15201B;
  --muted: #56645E;
  --faint: #6A7872;
  --line: #D5DED9;
  --sign: #0C6A45;
  --sign-ink: #FFFFFF;
  --sign-rim: #F3FAF6;
  --sign-line: rgba(255, 255, 255, .38);
  --sign-shadow: 0 14px 28px -16px rgba(9, 70, 45, .55);
  --la: #A9461A; --la-soft: #FBE6DA;
  --yo: #2E6A29; --yo-soft: #E1EFDC;
  --sf: #245AA3; --sf-soft: #E0EAF8;
  --other: #5A606B; --other-soft: #EBEDF0;
  --ok: #1D7650; --ok-soft: #D9EFE3;
  --due: #8F5405; --due-soft: #FAECD0;
  --stop: #B3361D; --stop-soft: #FAE2DC;
  --font-sign: "Overpass", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1411; --surface: #161E1A; --surface-2: #1C2521; --ink: #E5EDE9; --muted: #A0AEA7; --faint: #7F8D86; --line: #2A3530;
    --sign: #0D5E3D; --sign-ink: #F4FAF6; --sign-rim: #DDEBE3; --sign-line: rgba(255, 255, 255, .3); --sign-shadow: 0 14px 28px -16px rgba(0, 0, 0, .8);
    --la: #F2995F; --la-soft: #3B2216; --yo: #8DC57F; --yo-soft: #1B2D19; --sf: #82AEEE; --sf-soft: #16243A; --other: #ABB1BC; --other-soft: #252830;
    --ok: #62CC9C; --ok-soft: #133026; --due: #EAB257; --due-soft: #33260E; --stop: #F2846B; --stop-soft: #3B1C15;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1411; --surface: #161E1A; --surface-2: #1C2521; --ink: #E5EDE9; --muted: #A0AEA7; --faint: #7F8D86; --line: #2A3530;
  --sign: #0D5E3D; --sign-ink: #F4FAF6; --sign-rim: #DDEBE3; --sign-line: rgba(255, 255, 255, .3); --sign-shadow: 0 14px 28px -16px rgba(0, 0, 0, .8);
  --la: #F2995F; --la-soft: #3B2216; --yo: #8DC57F; --yo-soft: #1B2D19; --sf: #82AEEE; --sf-soft: #16243A; --other: #ABB1BC; --other-soft: #252830;
  --ok: #62CC9C; --ok-soft: #133026; --due: #EAB257; --due-soft: #33260E; --stop: #F2846B; --stop-soft: #3B1C15;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.65; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
a { color: inherit; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--sign); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }

/* ── hero: freeway distance sign ── */
.hero { padding-block: 46px 6px; }
.sign { position: relative; background: var(--sign); color: var(--sign-ink); border-radius: 16px; padding: 22px 22px 14px;
  box-shadow: inset 0 0 0 5px var(--sign), inset 0 0 0 8px var(--sign-rim), var(--sign-shadow); }
.exit { position: absolute; right: 24px; bottom: calc(100% - 2px); background: var(--sign); color: var(--sign-ink); border-radius: 10px 10px 0 0; padding: 5px 5px 0; }
.exit span { display: block; border: 3px solid var(--sign-rim); border-bottom: 0; border-radius: 7px 7px 0 0; padding: 3px 11px 5px; font: 800 14px/1.2 var(--font-body); white-space: nowrap; }
.kicker { margin: 0 0 6px; font: 800 12px/1.2 var(--font-sign); letter-spacing: .16em; text-transform: uppercase; opacity: .9; }
.sign h1 { margin: 0; font: 900 clamp(28px, 8.2vw, 40px)/1.18 var(--font-body); letter-spacing: .05em; text-wrap: balance; }
.legs { list-style: none; margin: 14px 0 0; padding: 8px 0 0; border-top: 2px solid var(--sign-line); }
.leg { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 12px; padding: 7px 0; }
.leg-name b, .leg-when b { display: block; font: 800 clamp(19px, 5.4vw, 24px)/1.12 var(--font-sign); }
.leg-name span, .leg-when span { display: block; font: 700 13.5px/1.35 var(--font-body); opacity: .88; }
.leg-when { text-align: right; font-variant-numeric: tabular-nums; }
.meta { margin: 12px 2px 0; display: flex; flex-wrap: wrap; gap: 2px 12px; color: var(--muted); font-size: 13.5px; }
.meta a { color: var(--ink); font-weight: 700; text-underline-offset: 3px; }
.meta .live { color: var(--ok); font-weight: 700; }

/* ── sticky section bar ── */
.jump { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); margin-top: 16px; }
.jump-in { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.jump-in::-webkit-scrollbar { display: none; }
.jump a { flex: none; padding: 10px 10px 8px; color: var(--muted); font-weight: 700; font-size: 14px; text-decoration: none; border-bottom: 3px solid transparent; }
.jump a:hover { color: var(--ink); border-bottom-color: var(--sign); }

/* ── sections ── */
.sec { padding-block: 26px 4px; scroll-margin-top: calc(52px + env(safe-area-inset-top, 0px)); }
.sec-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 14px; font-size: inherit; font-weight: inherit; }
.mini-sign { background: var(--sign); color: var(--sign-ink); border-radius: 8px; padding: 5px 13px 4px; font: 900 17px/1.35 var(--font-body); letter-spacing: .06em;
  box-shadow: inset 0 0 0 2.5px var(--sign), inset 0 0 0 4px var(--sign-rim); }
.sec-sub { color: var(--muted); font-size: 13px; }
.empty { margin: 0; color: var(--faint); font-size: 14px; }

/* ── heads-up list ── */
.notices { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.alert { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; padding: 9px 12px; border-radius: 10px; font-size: 14px; line-height: 1.6; }
.alert .ic { margin-top: 3px; }
.alert.stop { background: var(--stop-soft); } .alert.stop .ic { color: var(--stop); }
.alert.check { background: var(--due-soft); } .alert.check .ic { color: var(--due); }
.alert b { font-family: var(--font-sign); font-weight: 800; margin-right: 4px; }
.alert a { font-weight: 700; white-space: nowrap; text-underline-offset: 3px; }
.alert a .ic { width: 13px; height: 13px; margin: 0 0 0 1px; vertical-align: -1px; }
.alert-go { text-decoration: none; }

/* ── calendar ── */
.cal-box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; margin-bottom: 18px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .hd { text-align: center; font: 700 12px/1 var(--font-body); color: var(--faint); padding: 3px 0 6px; }
.tile { position: relative; display: flex; flex-direction: column; align-items: center; min-width: 0; min-height: 66px; padding: 5px 2px 6px; border-radius: 9px;
  text-decoration: none; color: var(--tone); background: var(--tone-soft); }
.tile.move { background: linear-gradient(135deg, var(--from-soft) 0 50%, var(--tone-soft) 50% 100%); }
.tile .m { font: 800 10px/1.2 var(--font-sign); color: var(--muted); min-height: 12px; }
.tile .d { font: 800 22px/1.08 var(--font-sign); color: var(--ink); font-variant-numeric: tabular-nums; }
.tile .r { margin-top: 2px; font: 700 10.5px/1.2 var(--font-body); white-space: nowrap; }
.tile .dot { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--stop); }
.tile .dot.check { background: var(--due); }
.tile.is-today { outline: 2px solid var(--ink); outline-offset: 1px; }
.tile:hover { box-shadow: inset 0 0 0 1.5px var(--tone); }
.cal-note { margin: 8px 2px 0; display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12.5px; color: var(--muted); }
.cal-note i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; background: var(--stop); }
.cal-note i.check { background: var(--due); }
.t-la { --tone: var(--la); --tone-soft: var(--la-soft); }
.t-yo { --tone: var(--yo); --tone-soft: var(--yo-soft); }
.t-sf { --tone: var(--sf); --tone-soft: var(--sf-soft); }
.t-other { --tone: var(--other); --tone-soft: var(--other-soft); }
.f-la { --from-soft: var(--la-soft); } .f-yo { --from-soft: var(--yo-soft); } .f-sf { --from-soft: var(--sf-soft); } .f-other { --from-soft: var(--other-soft); }

/* ── day list: mile-marker posts on a dashed lane line ── */
.days { position: relative; display: grid; gap: 14px; }
.days::before { content: ""; position: absolute; left: 25px; top: 10px; bottom: 10px; width: 2px;
  background: repeating-linear-gradient(to bottom, var(--line) 0 12px, transparent 12px 22px); }
.day { position: relative; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; scroll-margin-top: calc(56px + env(safe-area-inset-top, 0px)); }
.post { position: relative; z-index: 1; align-self: start; padding: 8px 0 9px; text-align: center; border-radius: 8px; background: var(--sign); color: var(--sign-ink);
  box-shadow: inset 0 0 0 2.5px var(--sign), inset 0 0 0 4px var(--sign-rim); }
.post .lbl { display: block; font: 900 10.5px/1 var(--font-sign); letter-spacing: .12em; }
.post .num { display: block; margin-top: 3px; font: 900 24px/1.05 var(--font-sign); font-variant-numeric: tabular-nums; }
.card { min-width: 0; padding: 12px 14px 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.day.is-today .card { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.dh { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 9px; }
.dh h3 { margin: 0 4px 0 0; display: flex; align-items: baseline; gap: 6px; font-size: inherit; }
.dh .date { font: 800 21px/1.1 var(--font-sign); font-variant-numeric: tabular-nums; }
.dh .wd { font: 700 13px/1 var(--font-body); color: var(--muted); }
.chip { display: inline-flex; align-items: center; padding: 1px 9px; border-radius: 999px; font: 700 12px/1.65 var(--font-body); color: var(--tone); background: var(--tone-soft); white-space: nowrap; }
.to { color: var(--muted); font: 700 13px/1 var(--font-sign); }
.tag { padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); font: 700 11.5px/1.7 var(--font-body); color: var(--ink); white-space: nowrap; }
.tag.now { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.acts { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.acts li { display: grid; grid-template-columns: 4.4em minmax(0, 1fr); gap: 8px; align-items: baseline; }
.slot { font: 700 12.5px/1.5 var(--font-body); color: var(--muted); }
.slot .tbd { color: var(--faint); font-weight: 500; }
.what { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.what .sub { color: var(--muted); font-size: 13px; }
.where, .tix { display: inline-flex; align-items: center; gap: 3px; margin-left: 2px; font-size: 13.5px; font-weight: 700; color: var(--muted); text-decoration: none; border-bottom: 1px dotted currentColor; }
.where .ic, .tix .ic { width: 14px; height: 14px; vertical-align: 0; }
.where:hover, .tix:hover { color: var(--ink); }
.card .alert { margin-top: 10px; font-size: 13.5px; }
.dfoot { margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--line); display: grid; gap: 4px; font-size: 13.5px; color: var(--muted); }
.dfoot p { margin: 0; display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 7px; align-items: start; }
.dfoot .ic { margin-top: 3px; }
.dfoot b { color: var(--ink); }
.dfoot span { min-width: 0; overflow-wrap: anywhere; }

/* ── stays ── */
.stays { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); align-items: start; }
.stay { min-width: 0; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.stay-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 10px 14px 9px; background: var(--tone-soft); color: var(--tone); }
.stay-h b { font: 900 18px/1.25 var(--font-body); }
.stay-h span { font: 800 13px/1 var(--font-sign); }
.stay-b { display: grid; gap: 9px; padding: 11px 14px 14px; font-size: 14px; }
.stay-b > p { margin: 0; }
.when { font-weight: 700; }
.when span { color: var(--muted); font-weight: 500; }
.addr-box { display: grid; gap: 7px; }
.addr { margin: 0; overflow-wrap: anywhere; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  font: 700 12.5px/1.3 var(--font-body); text-decoration: none; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn .ic { width: 14px; height: 14px; vertical-align: 0; }
.missing { color: var(--faint); }
.costline { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 8px; padding-top: 9px; border-top: 1px dashed var(--line); font-size: 13.5px; }
.costline .who { color: var(--muted); }
.amt { font: 800 15px/1.2 var(--font-sign); font-variant-numeric: tabular-nums; }
.pill { padding: 0 8px; border-radius: 999px; font: 700 11.5px/1.75 var(--font-body); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.due { background: var(--due-soft); color: var(--due); }
.pill.other { background: var(--other-soft); color: var(--other); }
.ideas { padding-top: 9px; border-top: 1px dashed var(--line); }
.ideas summary { cursor: pointer; font-weight: 700; font-size: 13.5px; }
.ideas ol { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 5px; font-size: 13.5px; }
.ideas ol + ol { margin-top: 9px; padding-top: 9px; border-top: 1px dotted var(--line); }
.ideas li span { color: var(--muted); }

/* ── money ── */
.money { display: grid; gap: 14px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.m-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px; }
.lbl { display: block; font: 700 12.5px/1.4 var(--font-body); color: var(--muted); }
.big { font: 900 clamp(30px, 8.4vw, 38px)/1.1 var(--font-sign); font-variant-numeric: tabular-nums; }
.per { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.per .val { font: 800 22px/1.15 var(--font-sign); font-variant-numeric: tabular-nums; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.stepper button { width: 34px; height: 30px; border: 0; background: transparent; color: var(--ink); font: 800 18px/1 var(--font-sign); cursor: pointer; }
.stepper button:hover { background: var(--line); }
.stepper output { min-width: 3.4em; text-align: center; font: 700 13.5px/1 var(--font-body); }
.bar { display: flex; height: 12px; overflow: hidden; border-radius: 999px; background: var(--due-soft); box-shadow: inset 0 0 0 1px var(--line); }
.bar span { background: var(--ok); }
.legend { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--muted); }
.legend b { color: var(--ink); font: 800 14px/1 var(--font-sign); font-variant-numeric: tabular-nums; }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.key.ok { background: var(--ok); }
.key.due { background: var(--due-soft); box-shadow: inset 0 0 0 1.5px var(--due); }
.ledger-h { margin: 4px 0 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 900 14.5px/1.4 var(--font-body); }
.ledger-h .amt { font-size: 14px; color: var(--muted); }
.ledger { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.ledger li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.ledger .nm { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.ledger .mt { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0 10px; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.payers { margin: 0; font-size: 13.5px; color: var(--muted); }
.payers b { color: var(--ink); }
.payers .nw { white-space: nowrap; }

/* ── todo / wish / links ── */
.todo { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.todo li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.todo .ring { width: 12px; height: 12px; margin-top: 6px; border: 2px solid var(--muted); border-radius: 50%; }
.todo b { font-weight: 700; }
.todo span { color: var(--muted); }
.wish-block + .wish-block { margin-top: 18px; }
.wish-block h3 { margin: 0 0 9px; font: 900 15px/1.4 var(--font-body); }
.wg { display: grid; grid-template-columns: 5.6em minmax(0, 1fr); gap: 8px 10px; align-items: start; margin-bottom: 9px; }
.wg .chip { justify-self: start; }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.chips li { padding: 3px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); font-size: 13.5px; overflow-wrap: anywhere; }
.chips a { font-weight: 700; text-underline-offset: 3px; }
.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.links a { display: flex; justify-content: space-between; align-items: center; gap: 12px; height: 100%; padding: 11px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; text-decoration: none; }
.links a:hover { border-color: var(--muted); }
.links b { display: block; font-weight: 700; }
.links small { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.links .ic { color: var(--muted); }

<script>
(() => {
  'use strict';
  const SHEET_ID = '1s37r8_FfR_cydTNwoCo4zm16UmDzWWiYYXstE2_fYrI';
  const TABS = { itin: '0', cal: '680698279', budget: '1222524594', links: '1853327747' };
  const LIVE = /*@LIVE*/true/*@*/;
  const SNAPSHOT = /*@SNAPSHOT*/{}/*@*/;
  const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit?usp=sharing`;
  const PEOPLE_KEY = 'usw-trip-people';
  const WD = ['日', '一', '二', '三', '四', '五', '六'];

  const PLACES = {
    LA: { zh: '洛杉磯', en: 'Los Angeles', short: 'LA', tone: 'la' },
    SF: { zh: '舊金山', en: 'San Francisco', short: 'SF', tone: 'sf' },

  const HOLIDAYS = { '12-24': '平安夜', '12-25': '聖誕節', '12-31': '跨年夜', '01-01': '元旦' };

  // 景點公休規則（依各官網公告）：活動文字符合 re，且日期／星期落在公休日，就提醒
  const RULES = [

      msg: why => `盧卡斯博物館${why}休館。`,

  const SHOP_RE = /outlet|奧特萊斯|奥特莱斯|市集|market|mall|商場|購物|百貨/i;
  const CHAINS = { text: '冬天開車進優勝美地常常要上雪鏈，可能臨時要求。車上先備好雪鏈，出發前查路況。',
    src: 'https://www.nps.gov/yose/planyourvisit/tirechains.htm', srcLabel: 'NPS 雪鏈規定', linkLabel: '優勝美地雪鏈規定（NPS）' };

  const ICONS = {
    bed: '<path d="M3 5v15"/><path d="M3 9h15a3 3 0 0 1 3 3v8"/><path d="M3 16h18"/><path d="M7 9v7"/>',
    warn: '<path d="M12 3.5 2.5 20h19L12 3.5z"/><path d="M12 10v4.5"/><path d="M12 17.4h.01"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.6h.01"/>',
    note: '<path d="M6 3h9l3 3v15H6z"/><path d="M9 11h6"/><path d="M9 15h6"/>',
    star: '<path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"/>',
    pin: '<path d="M12 21s-6.5-5.8-6.5-11a6.5 6.5 0 0 1 13 0c0 5.2-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>',
    ext: '<path d="M8 16 16 8"/><path d="M9.5 8H16v6.5"/>',
    copy: '<rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/>',
    arrow: '<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>',
  };
  const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;

  /* ── small helpers ── */
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const mk = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  const utc = k => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const fromUtc = t => { const d = new Date(t); return mk(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); };
  const addDays = (k, n) => fromUtc(utc(k) + n * 86400000);
  const dayDiff = (a, b) => Math.round((utc(b) - utc(a)) / 86400000);
  const wdOf = k => new Date(utc(k)).getUTCDay();
  const md = k => `${+k.slice(5, 7)}/${+k.slice(8, 10)}`;
  const mdw = k => `${md(k)}（${WD[wdOf(k)]}）`;
  const ymdw = k => `${k.slice(0, 4)}/${md(k)}（${WD[wdOf(k)]}）`;
  const nt = n => 'NT$' + Math.round(n).toLocaleString('en-US');
  const sum = a => a.reduce((s, x) => s + x, 0);
  const isUrl = s => /^https?:\/\/\S+$/i.test((s || '').trim());
  const mapUrl = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
  const extLink = (href, inner, cls) => `<a${cls ? ` class="${cls}"` : ''} href="${esc(href)}" target="_blank" rel="noopener">${inner}</a>`;

  function todayIn(tz) {
    try {
      const parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
      const g = t => parts.find(p => p.type === t).value;
      return `${g('year')}-${g('month')}-${g('day')}`;
    } catch (e) {
      const d = new Date();
      return mk(d.getFullYear(), d.getMonth() + 1, d.getDate());
    }
  }
  function parseFull(s) {
    const m = /^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/.exec((s || '').trim());
    return m ? mk(+m[1], +m[2], +m[3]) : null;
  }
  function parseMD(s, base) {
    const m = /^(\d{1,2})\/(\d{1,2})(?!\d)/.exec((s || '').trim());
    if (!m) return null;
    const mo = +m[1], d = +m[2];
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    let y = base.y;
    if (mo < base.m - 6) y += 1; else if (mo > base.m + 6) y -= 1;
    return mk(y, mo, d);
  }
  function money(s) {
    const t = String(s == null ? '' : s).replace(/[^\d.\-]/g, '');
    if (!t || t === '-' || t === '.') return null;
    const n = parseFloat(t);
    return isFinite(n) ? n : null;
  }
  function cleanUrl(u) {
    try {
      const x = new URL(u.trim());
      [...x.searchParams.keys()].forEach(k => { if (/^(utm_|fbclid$|gclid$|igshid$)/i.test(k)) x.searchParams.delete(k); });
      return x.toString();
    } catch (e) { return u.trim(); }
  }
  function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
  function tidy(s) {
    s = (s || '').trim();
    const o = (s.match(/[(（]/g) || []).length, c = (s.match(/[)）]/g) || []).length;
    if (c > o) s = s.replace(/[)）]+$/, '');
    if (o > c) s = s.replace(/^[(（]+/, '');
    return s.trim();
  }
  function placeOf(name) {
    const raw = (name || '').trim();
    if (!raw) return null;
    const up = raw.toUpperCase();
    const k = PLACES[raw] ? raw : PLACES[up] ? up : (ALIASES[raw] || ALIASES[up] || null);
    if (k) return Object.assign({ key: k }, PLACES[k]);
    return { key: raw, zh: raw, en: '', short: raw, tone: 'other' };
  }
  function normStay(s) {
    s = (s || '').trim();
    if (!s) return '';
    return /^(無|无|none|n\/a|-|—|–)$/i.test(s) ? 'none' : s;
  }
  function statusOf(s) {
    if (/已結清|已付|付清|已支付|paid/i.test(s || '')) return 'ok';
    if (/未|待|unpaid/i.test(s || '')) return 'due';
    return s ? 'other' : 'none';
  }

  /* ── CSV ── */
  function parseCSV(text) {
    const rows = [];
    let row = [], f = '', q = false;
    text = String(text || '').replace(/^﻿/, '');
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
        else f += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
      else if (c !== '\r') f += c;
    }
    if (f !== '' || row.length) { row.push(f); rows.push(row); }
    return rows.map(r => r.map(s => s.trim()));
  }

  /* ── 旅程行程 ── */
  const SLOT_RE = /^(早上|上午|中午|下午|傍晚|晚上|深夜|半夜|凌晨|全天|整天)[\s、,，:：\/\-–—]*/;
  function splitSlot(s) {
    let rest = (s || '').trim(), m;
    const slots = [];
    while ((m = SLOT_RE.exec(rest))) {
      const w = m[1] === '早上' ? '上午' : m[1];
      if (!slots.includes(w)) slots.push(w);
      rest = rest.slice(m[0].length);
    }
    return { slots, text: rest.trim() };
  }
  function parseItin(rows) {
    const out = { byDay: {}, keys: [] };
    const hi = rows.findIndex(r => r.includes('活動'));
    if (hi < 0) return out;
    const H = rows[hi], ix = (n, d) => { const i = H.indexOf(n); return i >= 0 ? i : d; };
    const cS = ix('開始日期', 0), cE = ix('結束日期', -1), cA = ix('活動', -1), cP = ix('地點', -1), cW = ix('人員', -1), cN = ix('附註', -1);
    let cur = null;
    for (let r = hi + 1; r < rows.length; r++) {
      const row = rows[r], g = c => (c >= 0 ? row[c] || '' : '');
      const d = parseFull(g(cS));
      if (d) { cur = d; if (!out.byDay[d]) { out.byDay[d] = []; out.keys.push(d); } }
      if (!cur) continue;
      const { slots, text } = splitSlot(g(cA));
      const place = g(cP), note = g(cN), who = g(cW);
      if (!text && !place && !note) continue;
      out.byDay[cur].push({ slots, text, place, note, who, end: parseFull(g(cE)) });
    }
    return out;
  }

  /* ── 行事曆（一張表裡有好幾塊，用標題格當錨點） ── */
  function parseCal(rows, base) {
    const out = { dates: {}, todos: [], wish: [], ideas: [] };
    const at = (r, c) => (rows[r] && c >= 0 && rows[r][c]) || '';
    const find = pred => {
      for (let r = 0; r < rows.length; r++) for (let c = 0; c < rows[r].length; c++) if (pred(rows[r][c], r, c)) return { r, c };
      return null;
    };
    const width = Math.max(0, ...rows.map(r => r.length));

    const h = find(v => v === '日期');
    if (h) {
      const H = rows[h.r];
      const col = n => { for (let c = h.c; c < H.length; c++) if (H[c] === n) return c; return -1; };
      const cRegion = col('區域'), cStay = col('入住'), cWish = col('許願景點'), cNote = col('備註');
      const cInfo = cStay >= 0 && !H[cStay + 1] ? cStay + 1 : -1;
      for (let r = h.r + 1; r < rows.length; r++) {
        const v = at(r, h.c);
        if (!v) continue;
        const k = parseMD(v, base);
        if (!k) break;
        out.dates[k] = { region: at(r, cRegion), stay: at(r, cStay), info: at(r, cInfo), wish: at(r, cWish), note: at(r, cNote) };
      }
    }

    const ref = find(v => v === '參考行程'), food = find(v => v === '吃飯皇帝大');
    const t = find(v => v === '待辦事項');
    if (t) {
      const stops = [ref, food].filter(a => a && a.r > t.r).map(a => a.r);
      const stopR = Math.min(rows.length, ...stops);
      for (let r = t.r + 1; r < stopR; r++) {
        const item = at(r, t.c);
        if (!item) continue;
        out.todos.push({ item, details: [1, 2, 3].map(i => at(r, t.c + i)).filter(Boolean) });
      }
    }

    const anchors = [ref, food].filter(Boolean).sort((a, b) => a.c - b.c);
    anchors.forEach((a, i) => {
      const next = anchors[i + 1];
      const endC = next && next.r === a.r ? next.c : width;
      const H = rows[a.r + 1] || [];
      const cols = [];
      let name = '';
      for (let c = a.c; c < endC; c++) { if (H[c]) name = H[c]; cols.push({ c, name }); }
      const groups = new Map(), last = {};
      cols.forEach(({ name }) => { if (name && !groups.has(name)) groups.set(name, []); });
      for (let r = a.r + 2; r < rows.length; r++) {
        cols.forEach(({ c, name }) => {
          const v = at(r, c);
          if (!v || !name) return;
          if (isUrl(v)) {
            if (last[c] && !last[c].url) last[c].url = cleanUrl(v);
            else groups.get(name).push({ text: hostOf(v) || '連結', url: cleanUrl(v) });
            return;
          }
          const it = { text: v, url: '' };
          last[c] = it;
          groups.get(name).push(it);
        });
      }
      const list = [...groups].map(([n, items]) => ({ name: n, items })).filter(g => g.items.length);
      if (list.length) out.wish.push({ title: at(a.r, a.c), groups: list });
    });

    const L = find((v, r) => v === '住宿' && rows[r].filter(Boolean).length === 1);
    if (L) {
      let grp = [];
      for (let r = L.r + 1; r < rows.length; r++) {
        const cells = [0, 1, 2, 3].map(i => at(r, L.c + i)).filter(Boolean);
        if (!cells.length) { if (grp.length) { out.ideas.push(grp); grp = []; } continue; }
        grp.push({ name: cells[0], details: cells.slice(1) });
      }
      if (grp.length) out.ideas.push(grp);
    }
    return out;
  }

  /* ── 旅程預算 ── */
  function parseBudget(rows) {
    const out = { items: [], sheetTotal: null };
    const hi = rows.findIndex(r => r.includes('費用'));
    if (hi < 0) return out;
    const H = rows[hi], ix = n => H.indexOf(n);
    const cD = ix('日期'), cN = ix('費用'), cT = ix('總費用'), cS = ix('狀態'), cM = ix('群組成員'), cW = ix('付款方式'), cX = ix('附註');
    for (let r = hi + 1; r < rows.length; r++) {
      const row = rows[r], g = c => (c >= 0 ? row[c] || '' : '');
      const name = g(cN).normalize('NFKC'), amt = money(g(cT));
      if (!name) { if (amt) out.sheetTotal = amt; continue; }
      out.items.push({ date: parseFull(g(cD)), name, amt, status: g(cS), st: statusOf(g(cS)), member: g(cM), pay: g(cW), note: g(cX) });
    }
    return out;
  }

  /* ── 工作表4 之類的連結頁 ── */
  function parseLinks(rows) {
    const out = [], last = {};
    rows.forEach(row => row.forEach((v, c) => {
      if (!v) return;
      if (isUrl(v)) { out.push({ label: tidy(last[c] || '') || hostOf(v), url: cleanUrl(v) }); last[c] = ''; }
      else last[c] = v;
    }));
    return out;
  }

  /* ── 組合成每天、每段住宿 ── */
  function buildDays(itin, cal) {
    const keys = [...new Set([...Object.keys(cal.dates), ...itin.keys])].sort();
    if (!keys.length) return [];
    let list = keys;
    const span = dayDiff(keys[0], keys[keys.length - 1]);
    if (span >= 0 && span <= 60) { list = []; for (let k = keys[0]; k <= keys[keys.length - 1]; k = addDays(k, 1)) list.push(k); }
    const days = list.map((k, i) => {
      const dt = cal.dates[k];
      return { key: k, index: i + 1, wd: wdOf(k), holiday: HOLIDAYS[k.slice(5)] || '', acts: itin.byDay[k] || [],
        rawStay: dt ? normStay(dt.stay) : '', regionRaw: dt ? dt.region : '', info: dt ? dt.info : '', wish: dt ? dt.wish : '', note: dt ? dt.note : '', alerts: [] };
    });
    days.forEach((d, i) => {
      d.stay = d.rawStay;
      if (d.stay) return;
      let p = i - 1; while (p >= 0 && !days[p].rawStay) p--;
      let n = i + 1; while (n < days.length && !days[n].rawStay) n++;
      if (p >= 0 && n < days.length && days[p].rawStay === days[n].rawStay && days[p].rawStay !== 'none') d.stay = days[p].rawStay;
    });
    let prevStay = '', prevRegion = '';
    days.forEach((d, i) => {
      const stayPlace = d.stay && d.stay !== 'none' ? placeOf(d.stay) : null;
      const prevPlace = prevStay && prevStay !== 'none' ? placeOf(prevStay) : null;
      let region = d.regionRaw ? placeOf(d.regionRaw) : null;
      if (!region) region = prevPlace || stayPlace || (prevRegion ? placeOf(prevRegion) : null);
      d.region = region;
      d.stayPlace = stayPlace;
      d.move = null;
      if (stayPlace && prevPlace && prevPlace.key !== stayPlace.key) d.move = { from: prevPlace, to: stayPlace };
      else if (stayPlace && region && region.key !== stayPlace.key) d.move = { from: region, to: stayPlace };
      const prev = days[i - 1];
      d.night = stayPlace ? (prev && prev.stayPlace && prev.stayPlace.key === stayPlace.key ? prev.night + 1 : 1) : 0;
      if (d.stay) prevStay = d.stay;
      if (region) prevRegion = region.key;
      const note = (d.note || '').trim(), head = note.split(/[\s　]+/)[0];
      d.noteShow = note && !(head && d.acts.some(a => (a.text + a.place).includes(head))) ? note : '';
    });
    return days;
  }

  function buildStays(days, budget, ideas) {
    const list = [];
    days.forEach(d => {
      if (!d.stayPlace) return;
      const g = list[list.length - 1];
      if (g && g.place.key === d.stayPlace.key && g.last === addDays(d.key, -1)) { g.nights++; g.last = d.key; if (!g.info && d.info) g.info = d.info; }
      else list.push({ place: d.stayPlace, from: d.key, last: d.key, nights: 1, info: d.info || '', costs: [], ideas: [] });
    });
    list.forEach(g => {
      g.out = addDays(g.last, 1);
      const names = [g.place.key, g.place.zh, g.place.short].filter(Boolean).map(x => x.toUpperCase());
      g.costs = budget.items.filter(it => {
        const n = (it.name || '').replace(/\s+/g, '').toUpperCase();
        return names.includes(n) || (names.some(x => n.includes(x)) && /住|宿|HOTEL|AIRBNB|旅館|飯店|酒店|民宿/.test(n));
      });
    });
    let orphanIdeas = [];
    if (ideas.length) {
      const texts = ideas.flat().map(x => [x.name].concat(x.details).join(' ').toLowerCase());
      let target = list.find(g => texts.some(t => t.includes(g.place.zh.toLowerCase()) || (g.place.en && t.includes(g.place.en.toLowerCase()))));
      if (!target) target = list.find(g => !g.info);
      if (target) target.ideas = ideas; else orphanIdeas = ideas;
    }
    return { list, orphanIdeas };
  }

  function buildAlerts(days) {
    const all = [];
    let chainsDone = false;
    days.forEach(d => {
      const mmdd = d.key.slice(5), month = +d.key.slice(5, 7), seen = new Set();
      const push = a => { if (seen.has(a.text)) return; seen.add(a.text); d.alerts.push(a); all.push(Object.assign({ key: d.key }, a)); };
      d.acts.forEach(a => {
        const hay = `${a.text} ${a.place}`;
        RULES.forEach(rule => {
          if (!rule.re.test(hay)) return;
          const why = (rule.closed && rule.closed[mmdd]) || (rule.weekdays && rule.weekdays[d.wd]);
          if (why) push({ level: 'stop', text: rule.msg(why), src: rule.src, srcLabel: rule.srcLabel, linkLabel: rule.linkLabel });
        });
      });
      if (mmdd === '12-25' && d.acts.some(a => SHOP_RE.test(`${a.text} ${a.place}`))) {
        push({ level: 'check', text: '聖誕節當天很多商場、Outlet 和市集公休或提早打烊，出發前先查營業時間。' });
      }
      const toYosemite = (d.stayPlace && d.stayPlace.tone === 'yo') || d.acts.some(a => /優勝美地|yosemite/i.test(a.text));
      if (!chainsDone && toYosemite && [11, 12, 1, 2, 3].includes(month)) {
        chainsDone = true;
        push({ level: 'check', text: CHAINS.text, src: CHAINS.src, srcLabel: CHAINS.srcLabel, linkLabel: CHAINS.linkLabel });
      }
    });
    return all;
  }

  function buildModel(src) {
    const itin = parseItin(parseCSV(src.itin));
    const first = itin.keys.slice().sort()[0] || todayIn();
    const cal = parseCal(parseCSV(src.cal), { y: +first.slice(0, 4), m: +first.slice(5, 7) });
    const budget = parseBudget(parseCSV(src.budget));
    const days = buildDays(itin, cal);

    // 口袋名單裡附了網址的項目（例如 NBA 購票連結），接到同名的行程上
    const linked = [];
    cal.wish.forEach(t => t.groups.forEach(g => g.items.forEach(it => {
      if (!it.url) return;
      const m = /^(.*?)[(（](.*?)[)）]?$/.exec(it.text);
      linked.push({ base: (m ? m[1] : it.text).trim(), label: (m && m[2].trim()) || '連結', url: it.url, text: tidy(it.text) });
    })));
    days.forEach(d => d.acts.forEach(a => {
      const hay = `${a.text} ${a.place}`.toLowerCase();
      const hit = linked.find(l => l.base.length >= 2 && hay.includes(l.base.toLowerCase()));
      if (hit) a.link = { label: hit.label, url: hit.url };
    }));

    const stays = buildStays(days, budget, cal.ideas);
    const alerts = buildAlerts(days);
    const links = [];
    const addLink = l => { if (l.url && !links.some(x => x.url === l.url)) links.push(l); };
    linked.forEach(l => addLink({ label: l.text.replace(/[(（].*$/, '').trim() + ' ' + l.label, url: l.url }));
    parseLinks(parseCSV(src.links)).forEach(addLink);
    alerts.forEach(a => { if (a.src) addLink({ label: a.linkLabel || a.srcLabel, url: a.src }); });
    return { days, stays, budget, todos: cal.todos, wish: cal.wish, links, alerts };
  }

  /* ── render ── */
  const pill = st => {
    const map = { ok: ['ok', '已結清'], due: ['due', '未支付'] };
    return map[st.st] ? `<span class="pill ${map[st.st][0]}">${esc(st.status || map[st.st][1])}</span>` : (st.status ? `<span class="pill other">${esc(st.status)}</span>` : '');
  };

  function tripState(days) {
    const start = days[0].key, end = days[days.length - 1].key;
    const local = todayIn(), la = todayIn('America/Los_Angeles');
    if (local < start) { const n = dayDiff(local, start); return { exit: n === 1 ? '明天出發' : `還有 ${n} 天`, today: '' }; }
    if (la < start) return { exit: '今天出發', today: '' };
    if (la <= end) return { exit: `旅程第 ${dayDiff(start, la) + 1} 天`, today: la };
    return { exit: '旅程結束', today: '' };
  }

  function fmtAt(at) {
    const d = at instanceof Date ? at : new Date(at);
    if (isNaN(d)) return '';
    return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function renderHero(m, st, status) {
    const legs = m.stays.list.map(g => `<li class="leg"><span class="leg-name"><b${g.place.en ? ' lang="en"' : ''}>${esc(g.place.en || g.place.zh)}</b>${g.place.en ? `<span>${esc(g.place.zh)}</span>` : ''}</span>`
      + `<span class="leg-when"><b>${md(g.from)}</b><span>${g.nights} 晚</span></span></li>`).join('');
    $('legs').innerHTML = legs;
    $('legs').hidden = !legs;
    $('exit-text').textContent = st.exit;
    $('exit').hidden = false;
    const start = m.days[0].key, end = m.days[m.days.length - 1].key;
    const nights = sum(m.stays.list.map(g => g.nights));
    const sync = status.live ? `<span class="live">已同步試算表 ${esc(fmtAt(status.at))}</span>` : `<span>${esc(status.note || `試算表資料 ${fmtAt(status.at)}`)}</span>`;
    $('meta').innerHTML = `<span>${ymdw(start)} → ${ymdw(end)}</span><span>${m.days.length} 天 ${nights} 夜</span>${sync}`
      + extLink(SHEET_URL, '開啟試算表');
  }

  function renderAlerts(m) {
    $('headsup').hidden = !m.alerts.length;
    $('notices').innerHTML = m.alerts.map(a => `<li class="alert ${a.level}">${ic(a.level === 'stop' ? 'warn' : 'info')}<span>`
      + `<a class="alert-go" href="#d-${a.key}"><b>${mdw(a.key)}</b></a>${esc(a.text)}`
      + (a.src ? ` ${extLink(a.src, `${esc(a.srcLabel)}${ic('ext')}`)}` : '') + '</span></li>').join('');
  }

  function renderCalendar(m, st) {
    const lead = (m.days[0].wd + 6) % 7;
    const cells = ['一', '二', '三', '四', '五', '六', '日'].map(w => `<span class="hd">${w}</span>`);
    for (let i = 0; i < lead; i++) cells.push('<span></span>');
    m.days.forEach((d, i) => {
      const here = d.stayPlace || d.region || placeOf('?');
      const from = d.move ? d.move.from : null;
      const showMonth = i === 0 || d.key.slice(8) === '01';
      const alert = d.alerts.find(a => a.level === 'stop') || d.alerts[0];
      const label = `${mdw(d.key)}${d.region ? ' ' + d.region.zh : ''}${d.move ? `，${d.move.from.zh}→${d.move.to.zh}` : ''}`;
      cells.push(`<a class="tile t-${here.tone}${from ? ` move f-${from.tone}` : ''}${d.key === st.today ? ' is-today' : ''}" href="#d-${d.key}" aria-label="${esc(label)}">`
        + `<span class="m">${showMonth ? `${+d.key.slice(5, 7)}月` : ''}</span><span class="d">${+d.key.slice(8)}</span>`
        + `<span class="r">${esc(here.short)}</span>${alert ? `<i class="dot ${alert.level}"></i>` : ''}</a>`);
    });
    $('cal').innerHTML = cells.join('');
    const notes = [];
    if (m.days.some(d => d.move)) notes.push('斜分兩色＝移動日');
    if (m.alerts.some(a => a.level === 'stop')) notes.push('<span><i></i>行程撞到公休</span>');
    if (m.alerts.some(a => a.level === 'check')) notes.push('<span><i class="check"></i>出發前要確認</span>');
    $('cal-note').innerHTML = notes.map(n => n.startsWith('<') ? n : `<span>${n}</span>`).join('');
    $('cal-note').hidden = !notes.length;
  }

  function actHTML(a, d) {
    const slot = a.slots.length ? esc(a.slots.join('–')) : '<span class="tbd">未定</span>';
    const parts = [];
    if (a.text) parts.push(esc(a.text));
    if (a.place) {
      const q = a.place + (d.region && d.region.en ? ` ${d.region.en}` : '');
      parts.push(extLink(mapUrl(q), `${ic('pin')}${esc(a.place)}`, 'where'));
    }
    if (a.link) parts.push(extLink(a.link.url, `${esc(a.link.label)}${ic('ext')}`, 'tix'));
    const sub = [];
    if (a.end && a.end !== d.key) sub.push(`到 ${md(a.end)}`);
    if (a.who) sub.push(esc(a.who));
    if (a.note) sub.push(esc(a.note));
    return `<li><span class="slot">${slot}</span><div class="what">${parts.join(' ')}${sub.length ? `<div class="sub">${sub.join(' · ')}</div>` : ''}</div></li>`;
  }

  function alertHTML(a) {
    return `<p class="alert ${a.level}">${ic(a.level === 'stop' ? 'warn' : 'info')}<span>${esc(a.text)}`
      + (a.src ? ` ${extLink(a.src, `${esc(a.srcLabel)}${ic('ext')}`)}` : '') + '</span></p>';
  }

  function renderDays(m, st) {
    $('days-sub').textContent = `${m.days.length} 天 · 點日曆可以跳到那一天`;
    $('daylist').innerHTML = m.days.map(d => {
      const head = [];
      if (d.move) head.push(`<span class="chip t-${d.move.from.tone}">${esc(d.move.from.zh)}</span><span class="to">→</span><span class="chip t-${d.move.to.tone}">${esc(d.move.to.zh)}</span>`);
      else if (d.region) head.push(`<span class="chip t-${d.region.tone}">${esc(d.region.zh)}</span>`);
      if (d.holiday) head.push(`<span class="tag">${esc(d.holiday)}</span>`);
      if (d.key === st.today) head.push('<span class="tag now">今天</span>');
      const foot = [];
      if (d.stayPlace) foot.push(`<p>${ic('bed')}<span>今晚住 <b>${esc(d.stayPlace.zh)}</b> · 第 ${d.night} 晚${d.night === 1 && d.info ? ` · ${esc(d.info)}` : ''}</span></p>`);
      else if (d.stay === 'none') foot.push(`<p>${ic('bed')}<span>今晚不住宿</span></p>`);
      if (d.wish) foot.push(`<p>${ic('star')}<span>想去：${esc(d.wish)}</span></p>`);
      if (d.noteShow) foot.push(`<p>${ic('note')}<span>${esc(d.noteShow)}</span></p>`);
      return `<article class="day${d.key === st.today ? ' is-today' : ''}" id="d-${d.key}">`
        + `<div class="post" aria-hidden="true"><span class="lbl">DAY</span><span class="num">${d.index}</span></div>`
        + `<div class="card"><header class="dh"><h3><span class="date">${md(d.key)}</span><span class="wd">週${WD[d.wd]}</span></h3>${head.join('')}</header>`
        + (d.acts.length ? `<ul class="acts">${d.acts.map(a => actHTML(a, d)).join('')}</ul>` : '<p class="empty">還沒排行程</p>')
        + d.alerts.map(alertHTML).join('')
        + (foot.length ? `<div class="dfoot">${foot.join('')}</div>` : '')
        + '</div></article>';
    }).join('');
  }

  function ideasHTML(ideas, open) {
    const n = sum(ideas.map(g => g.length));
    return `<details class="ideas"${open ? ' open' : ''}><summary>試算表裡的候選住宿（${n}）</summary>`
      + ideas.map(g => `<ol>${g.map(x => `<li><b>${esc(x.name)}</b>${x.details.length ? `<span> · ${x.details.map(esc).join(' · ')}</span>` : ''}</li>`).join('')}</ol>`).join('')
      + '</details>';
  }

  function renderStays(m) {
    const { list, orphanIdeas } = m.stays;
    $('stays-sub').textContent = list.length ? `${list.length} 個地方 · ${sum(list.map(g => g.nights))} 晚` : '';
    const cards = list.map(g => {
      const p = g.place, rows = [];
      rows.push(`<p class="when">${mdw(g.from)} 入住 → ${mdw(g.out)} 退房 <span>· ${g.nights} 晚</span></p>`);
      if (g.info) {
        rows.push(`<div class="addr-box"><p class="addr">${esc(g.info)}</p><div class="btns">`
          + extLink(mapUrl(g.info), `${ic('pin')}開地圖`, 'btn')
          + `<button class="btn" type="button" data-copy="${esc(g.info)}">${ic('copy')}<span>複製</span></button></div></div>`);
      } else rows.push('<p class="missing">試算表還沒填住宿名稱或地址</p>');
      g.costs.forEach(c => rows.push(`<p class="costline"><span>${esc(c.name)}</span><span class="amt">${c.amt != null ? nt(c.amt) : '—'}</span>${pill(c)}${c.member ? `<span class="who">${esc(c.member)}</span>` : ''}</p>`));
      if (g.ideas.length) rows.push(ideasHTML(g.ideas, false));
      return `<article class="stay t-${p.tone}"><header class="stay-h"><b>${esc(p.zh)}</b>${p.en ? `<span lang="en">${esc(p.en)}</span>` : ''}</header><div class="stay-b">${rows.join('')}</div></article>`;
    });
    if (orphanIdeas.length) cards.push(`<article class="stay t-other"><header class="stay-h"><b>候選住宿</b></header><div class="stay-b">${ideasHTML(orphanIdeas, true)}</div></article>`);
    $('staylist').innerHTML = cards.join('') || '<p class="empty">行事曆還沒填入住地點</p>';
  }

  function readPeople(dflt) {
    try { const v = parseInt(localStorage.getItem(PEOPLE_KEY), 10); if (v >= 1 && v <= 20) return v; } catch (e) { /* storage blocked */ }
    return dflt;
  }
  function savePeople(n) { try { localStorage.setItem(PEOPLE_KEY, String(n)); } catch (e) { /* storage blocked */ } }

  let moneyState = null;
  function renderMoney(m) {
    const items = m.budget.items;
    if (!items.length) { $('moneybox').innerHTML = '<p class="empty">預算表還沒有資料</p>'; moneyState = null; return; }
    const total = sum(items.map(i => i.amt || 0));
    const paidItems = items.filter(i => i.st === 'ok'), dueItems = items.filter(i => i.st !== 'ok');
    const paid = sum(paidItems.map(i => i.amt || 0)), due = total - paid;
    const pct = total ? Math.round(paid / total * 100) : 0;
    const members = [...new Set(items.flatMap(i => (i.member || '').split(/[、,，\/]+/).map(s => s.trim()).filter(Boolean)))];
    const people = readPeople(Math.max(2, members.length));
    moneyState = { total, people };
    const row = i => `<li><span class="nm">${esc(i.name)}</span><span class="amt">${i.amt != null ? nt(i.amt) : '—'}</span>`
      + `<span class="mt">${[i.date ? md(i.date) : '', i.member, i.note, i.pay].filter(Boolean).map(esc).map(s => `<span>${s}</span>`).join('')}</span></li>`;
    const group = (title, list) => list.length ? `<h3 class="ledger-h"><span>${title}（${list.length} 筆）</span><span class="amt">${nt(sum(list.map(i => i.amt || 0)))}</span></h3><ul class="ledger">${list.map(row).join('')}</ul>` : '';
    const byPayer = {};
    paidItems.forEach(i => { if (i.member) byPayer[i.member] = (byPayer[i.member] || 0) + (i.amt || 0); });
    const payers = Object.entries(byPayer).sort((a, b) => b[1] - a[1]).map(([n, v]) => `<span class="nw"><b>${esc(n)}</b> ${nt(v)}</span>`).join(' · ');
    $('moneybox').innerHTML = `<div class="m-top"><div><span class="lbl">總費用</span><span class="big">${nt(total)}</span></div>`
      + `<div><span class="lbl">平均每人</span><div class="per"><span class="val" id="pp-val">${nt(total / people)}</span>`
      + `<span class="stepper"><button type="button" id="pp-minus" aria-label="少一人">−</button><output id="pp-n" aria-live="polite">${people} 人</output><button type="button" id="pp-plus" aria-label="多一人">+</button></span></div></div></div>`
      + `<div class="bar" role="img" aria-label="已結清 ${pct}%"><span style="width:${pct}%"></span></div>`
      + `<p class="legend"><span><i class="key ok"></i>已結清 <b>${nt(paid)}</b>（${pct}%）</span><span><i class="key due"></i>還沒付 <b>${nt(due)}</b></span></p>`
      + group('還沒付', dueItems) + group('已結清', paidItems)
      + (payers ? `<p class="payers">已經付款：${payers}</p>` : '');
  }
  function setPeople(n) {
    if (!moneyState) return;
    n = Math.max(1, Math.min(20, n));
    moneyState.people = n;
    savePeople(n);
    $('pp-n').textContent = `${n} 人`;
    $('pp-val').textContent = nt(moneyState.total / n);
  }

  function renderTodo(m) {
    $('todolist').innerHTML = m.todos.map(t => `<li><i class="ring" aria-hidden="true"></i><div><b>${esc(t.item)}</b>${t.details.length ? `<span> · ${t.details.map(esc).join(' · ')}</span>` : ''}</div></li>`).join('')
      || '<li><i class="ring" aria-hidden="true"></i><div><span>目前沒有待辦</span></div></li>';
  }

  function renderWish(m) {
    $('wishbox').innerHTML = m.wish.map(block => `<div class="wish-block"><h3>${esc(block.title)}</h3>`
      + block.groups.map(g => {
        const p = placeOf(g.name);
        return `<div class="wg"><span class="chip t-${p.tone}">${esc(p.zh)}</span><ul class="chips">`
          + g.items.map(it => `<li>${it.url ? extLink(it.url, `${esc(tidy(it.text))}${ic('ext')}`) : esc(it.text)}</li>`).join('') + '</ul></div>';
      }).join('') + '</div>').join('') || '<p class="empty">還沒有口袋名單</p>';
  }

  function renderLinks(m) {
    const list = m.links.concat([{ label: 'Google 試算表（原始資料）', url: SHEET_URL }]);
    $('linklist').innerHTML = list.map(l => `<li>${extLink(l.url, `<span><b>${esc(l.label)}</b><small>${esc(hostOf(l.url))}</small></span>${ic('ext')}`)}</li>`).join('');
  }

  function renderFoot(status) {
    $('foot').innerHTML = `<p>整理自 Google 試算表「迪士尼留給亞洲去」的四個分頁：旅程行程、行事曆、旅程預算、工作表4。`
      + `${status.live ? `最後同步：${esc(fmtAt(status.at))}。` : `資料時間：${esc(fmtAt(status.at))}。`}</p>`
      + '<p>行前提醒是比對各景點官網公告的公休日，出發前請再到官網確認。</p>';
  }

  function draw(src, status) {
    const model = buildModel(src);
    window.__trip = model;
    if (!model.days.length) { $('daylist').innerHTML = '<p class="empty">試算表裡還沒有日期</p>'; return; }
    const st = tripState(model.days);
    renderHero(model, st, status);
    renderAlerts(model);
    renderCalendar(model, st);
    renderDays(model, st);
    renderStays(model);
    renderMoney(model);
    renderTodo(model);
    renderWish(model);
    renderLinks(model);
    renderFoot(status);
  }

  let lastFetch = 0;
  async function refresh() {
    lastFetch = Date.now();
    const base = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=`;
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 12000);
    try {
      const pairs = await Promise.all(Object.entries(TABS).map(async ([k, gid]) => {
        const r = await fetch(base + gid, { signal: ctl.signal, cache: 'no-store' });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return [k, await r.text()];
      }));
      const src = Object.fromEntries(pairs);
      if (!src.itin.includes('活動')) throw new Error('unexpected sheet content');
      draw(src, { live: true, at: new Date() });
      $('main').hidden = false;
    } catch (e) {
      if (SNAPSHOT && SNAPSHOT.itin) {
        draw(SNAPSHOT, { live: false, at: SNAPSHOT.at, note: `連不上試算表，先顯示 ${fmtAt(SNAPSHOT.at)} 的資料` });
      } else if ($('main').hidden) {
        $('meta').innerHTML = `<span>連不上試算表，請稍後重新整理。</span>${extLink(SHEET_URL, '直接開啟試算表')}`;
      } else {
        const s = $('meta').querySelector('.live');
        if (s) s.textContent = '這次沒同步到，顯示上次的資料';
      }
    } finally { clearTimeout(timer); }
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('#pp-minus, #pp-plus, [data-copy]');
    if (!t) return;
    if (t.id === 'pp-minus') return setPeople(moneyState.people - 1);
    if (t.id === 'pp-plus') return setPeople(moneyState.people + 1);
    const text = t.getAttribute('data-copy');
    const label = t.querySelector('span');
    const flash = msg => { const old = label.textContent; label.textContent = msg; setTimeout(() => { label.textContent = old === msg ? '複製' : old; }, 1800); };
    const fallback = () => {
      const addr = t.closest('.addr-box') && t.closest('.addr-box').querySelector('.addr');
      if (addr) { const r = document.createRange(); r.selectNodeContents(addr); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
      flash('已選取');
    };
    try { navigator.clipboard.writeText(text).then(() => flash('已複製'), fallback); } catch (err) { fallback(); }
  });

  document.documentElement.lang = 'zh-Hant-TW';
  const hasSnap = !!(SNAPSHOT && SNAPSHOT.itin);
  const jumpToHash = () => {
    if (location.hash.length < 2) return;
    const el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (el) el.scrollIntoView();
  };
  if (hasSnap) {
    try {
      draw(SNAPSHOT, { live: false, at: SNAPSHOT.at });
    } catch (e) {
      $('daylist').innerHTML = `<p class="empty">資料讀取失敗：${esc(e.message)}</p>`;
    }
    jumpToHash();
  } else {
    $('main').hidden = true;
    $('meta').innerHTML = '<span>正在讀取試算表…</span>';
  }
  if (LIVE) {
    refresh().then(() => { if (!hasSnap) jumpToHash(); });
    // 手機分頁放著好幾天，回到頁面時超過 5 分鐘就重抓一次
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && Date.now() - lastFetch > 5 * 60 * 1000) refresh();
    });
  }
})();
</script>

</body>
</html>
